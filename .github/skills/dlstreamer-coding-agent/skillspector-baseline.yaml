# SkillSpector baseline — findings listed here are suppressed on future scans.
# Edit 'reason' fields and add glob 'rules' as needed. See docs/SUPPRESSION.md.
version: 2
scanner_version: 2.9.6
rules:
  - id: "PE5"
    message: "*--device /dev/*"
    reason: >-
      Reviewed: Docker command runs as non-root (-u) with only render-node
      device access for GPU/NPU inference. No privileged mode or container
      escape vector.
  - id: "PE5"
    path: "references/*"
    message: "*--network host*"
    reason: >-
      Reviewed: --network host appears in reference docs as a Docker hint
      for WebRTC signaling connectivity, not executable code.
  - id: "RP1"
    path: "**/*.md"
    message: "*intel/dlstreamer*"
    reason: >-
      Reviewed: intel/dlstreamer:latest is the documented default image tag
      for DL Streamer. The skill intentionally uses :latest so that users
      always pull the most recent stable release without manual version bumps.
