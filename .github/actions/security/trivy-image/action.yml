name: "Trivy Image Scanner"
description: "Scan a local container image with Trivy without requiring a system-wide installation"

inputs:
  scan_target:
    description: "Local image name or image reference to scan"
    required: true
  severity:
    description: "Minimum vulnerability severity (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)"
    required: false
    default: "HIGH"
  format:
    description: "Trivy report format"
    required: false
    default: "table"
  timeout:
    description: "Maximum scan duration"
    required: false
    default: "20m"
  ignore_unfixed:
    description: "Ignore vulnerabilities without a fix"
    required: false
    default: "true"
  report_suffix:
    description: "Suffix added to the uploaded report name"
    required: false
    default: ""
  trivy_version:
    description: "Trivy version to use"
    required: false
    default: "0.74.0"

outputs:
  scan_result:
    description: "Exit code returned by Trivy"
    value: ${{ steps.run-trivy.outputs.exit_code }}
  report_path:
    description: "Path to the generated Trivy report"
    value: ${{ steps.run-trivy.outputs.report_path }}

runs:
  using: composite
  steps:
    - name: Cache Trivy vulnerability database
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
      with:
        path: ${{ runner.temp }}/trivy-cache
        key: trivy-db-${{ runner.os }}-${{ inputs.trivy_version }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          trivy-db-${{ runner.os }}-${{ inputs.trivy_version }}-

    - name: Find or install Trivy
      id: setup-trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy_version }}
      run: |
        set -euo pipefail

        if [[ ! "$TRIVY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid Trivy version: $TRIVY_VERSION"
          exit 1
        fi

        if command -v trivy >/dev/null 2>&1; then
          if version_output="$(trivy --version 2>/dev/null)"; then
            installed_version="$(printf '%s\n' "$version_output" | awk '/^Version:/{print $2; exit}')"
            if [[ "$installed_version" == "$TRIVY_VERSION" ]]; then
              echo "Using preinstalled Trivy $TRIVY_VERSION"
              echo "trivy_bin=$(command -v trivy)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Preinstalled Trivy version '${installed_version:-unknown}' does not match $TRIVY_VERSION; installing the requested version locally."
          else
            echo "::notice::Preinstalled Trivy could not be run; installing the requested version locally."
          fi
        fi

        install_dir="${RUNNER_TEMP}/trivy/${TRIVY_VERSION}/bin"
        mkdir -p "$install_dir"
        curl -fsSL --retry 3 --retry-all-errors \
          "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
          | sh -s -- -b "$install_dir" "v${TRIVY_VERSION}"

        if ! "$install_dir/trivy" --version | grep -Fq "Version: ${TRIVY_VERSION}"; then
          echo "::error::The installed Trivy binary does not report version $TRIVY_VERSION."
          exit 1
        fi

        echo "trivy_bin=$install_dir/trivy" >> "$GITHUB_OUTPUT"

    - name: Download Trivy vulnerability database
      shell: bash
      env:
        TRIVY_BIN: ${{ steps.setup-trivy.outputs.trivy_bin }}
        TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
      run: |
        set -euo pipefail
        mkdir -p "$TRIVY_CACHE_DIR"

        for attempt in 1 2 3; do
          echo "Attempt $attempt to download the Trivy vulnerability database..."
          if "$TRIVY_BIN" --cache-dir "$TRIVY_CACHE_DIR" image --download-db-only; then
            exit 0
          fi
          if [[ "$attempt" -lt 3 ]]; then
            sleep $((attempt * 10))
          fi
        done

        echo "::error::Failed to download the Trivy vulnerability database after 3 attempts."
        exit 1

    - name: Run Trivy image scan
      id: run-trivy
      shell: bash
      env:
        TRIVY_BIN: ${{ steps.setup-trivy.outputs.trivy_bin }}
        TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        SCAN_TARGET: ${{ inputs.scan_target }}
        SEVERITY: ${{ inputs.severity }}
        REPORT_FORMAT: ${{ inputs.format }}
        SCAN_TIMEOUT: ${{ inputs.timeout }}
        IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
      run: |
        set -euo pipefail

        if [[ -z "$SCAN_TARGET" ]]; then
          echo "::error::scan_target must not be empty."
          exit 1
        fi

        case "$REPORT_FORMAT" in
          table|json|sarif) ;;
          *)
            echo "::error::Unsupported Trivy report format: $REPORT_FORMAT"
            exit 1
            ;;
        esac

        case "$SEVERITY" in
          LOW) TRIVY_SEVERITY="LOW,MEDIUM,HIGH,CRITICAL" ;;
          MEDIUM) TRIVY_SEVERITY="MEDIUM,HIGH,CRITICAL" ;;
          HIGH) TRIVY_SEVERITY="HIGH,CRITICAL" ;;
          CRITICAL) TRIVY_SEVERITY="CRITICAL" ;;
          UNKNOWN) TRIVY_SEVERITY="UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL" ;;
          *)
            if [[ "$SEVERITY" =~ ^(UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL)(,(UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL))*$ ]]; then
              TRIVY_SEVERITY="$SEVERITY"
            else
              echo "::error::Invalid Trivy severity: $SEVERITY"
              exit 1
            fi
            ;;
        esac

        if [[ "$IGNORE_UNFIXED" != "true" && "$IGNORE_UNFIXED" != "false" ]]; then
          echo "::error::ignore_unfixed must be 'true' or 'false'."
          exit 1
        fi

        mkdir -p security-results/trivy
        report_file="security-results/trivy/trivy-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}.${REPORT_FORMAT}"

        args=(
          --cache-dir "$TRIVY_CACHE_DIR"
          image
          --severity "$TRIVY_SEVERITY"
          --format "$REPORT_FORMAT"
          --output "$report_file"
          --timeout "$SCAN_TIMEOUT"
          --exit-code 1
        )
        if [[ "$IGNORE_UNFIXED" == "true" ]]; then
          args+=(--ignore-unfixed)
        fi
        args+=("$SCAN_TARGET")

        set +e
        "$TRIVY_BIN" "${args[@]}"
        exit_code=$?
        set -e

        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
        if [[ -f "$report_file" ]]; then
          echo "report_path=$report_file" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Trivy did not generate a report."
          exit 1
        fi

    - name: Upload Trivy report
      if: always() && steps.run-trivy.outputs.report_path != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: trivy-results-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.report_suffix }}
        path: ${{ steps.run-trivy.outputs.report_path }}
        retention-days: 7

    - name: Fail if Trivy scan failed
      if: steps.run-trivy.outputs.exit_code != '0'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run-trivy.outputs.exit_code }}
      run: |
        echo "::error::Trivy image scan failed with exit code ${EXIT_CODE:-unknown}."
        exit 1
