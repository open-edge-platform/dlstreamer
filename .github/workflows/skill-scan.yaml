name: Skill Scanner
run-name: "Skill Scanner (by @${{ github.actor }} via ${{ github.event_name }})"
on:
  workflow_call:
    inputs:
      severity:
        description: "SkillSpector severity level (CRITICAL, HIGH, MEDIUM, LOW)"
        required: false
        type: string
        default: "LOW"
      fail_on_findings:
        description: "Fail the workflow when findings are detected"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      severity:
        description: "SkillSpector severity level (CRITICAL, HIGH, MEDIUM, LOW)"
        required: false
        default: "LOW"
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
      fail_on_findings:
        description: "Fail the workflow when findings are detected"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  discover-skills:
    name: Discover skill paths
    runs-on: dlstreamer
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find-paths.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find all .github/skills directories
        id: find-paths
        run: |
          paths=$(find . -path '*/.github/skills' -type d \
            | sed 's|^\./||' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$paths" >> "$GITHUB_OUTPUT"

  skillspector-scan:
    name: SkillSpector security scan (${{ matrix.skills-path }})
    needs: discover-skills
    runs-on: dlstreamer
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skills-path: ${{ fromJson(needs.discover-skills.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run SkillSpector scan
        uses: open-edge-platform/geti-ci/actions/skill-scan@fd69b9f71343db7a4a88d8d7b984a281dd475a98 # skill-scan/v0.1.2
        with:
          skills-path: ${{ matrix.skills-path }}
          severity-level: ${{ inputs.severity || 'LOW' }}
          fail-on-findings: ${{ inputs.fail_on_findings || 'true' }}

  skill-validator-scan:
    name: skill-validator scan (${{ matrix.skills-path }})
    needs: discover-skills
    runs-on: dlstreamer
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skills-path: ${{ fromJson(needs.discover-skills.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run skill-validator
        uses: open-edge-platform/geti-ci/actions/skill-validator@3fd1ebf48e46ec6584850e20616763e73ddf94e9 # skill-validator/v0.2.2
        with:
          skills-path: ${{ matrix.skills-path }}
          fail-on-findings: ${{ inputs.fail_on_findings || 'true' }}
          allow-dirs: "evals,example-prompts,benchmark"
