name: "[DLS] Zizmor Scan"
run-name: "[DLS] Zizmor Scan"

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Run security checks every day at 2 AM UTC
    - cron: "0 2 * * *"

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor-scan:
    name: "Run Zizmor Scan"
    permissions:
      contents: read
      security-events: write # Needed to upload the results to code-scanning dashboard
    runs-on: dlstreamer
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
      - name: "Run Zizmor scan"
        uses: open-edge-platform/geti-ci/actions/zizmor@cffbec1b3b7c155efa789cd2ea67a2a765a4369f # zizmor/v0.1.4
        with:
          scan-scope: all
          severity-level: LOW
          fail-on-findings: true
