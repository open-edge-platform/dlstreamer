name: "[DLS] [U22/24] Build and test .deb pkgs & deb imgs"
run-name: "[DLS] [U22/24] Build and test .deb pkgs & deb imgs (by ${{ github.actor }})"
on:
  workflow_call:
    inputs:
      test-repo-branch:
        description: "Branch in dl-streamer-tests repo (default is main)"
        required: false
        type: string
        default: "main"
    outputs:
      current-image-size-ubuntu22:
        description: "Current DEB image size in MB for ubuntu22"
        value: ${{ jobs.build.outputs.current-image-size-ubuntu22 }}
      current-image-size-ubuntu24:
        description: "Current DEB image size in MB for ubuntu24"
        value: ${{ jobs.build.outputs.current-image-size-ubuntu24 }}
  workflow_dispatch:
    inputs:
      test-repo-branch:
        description: "Branch in dl-streamer-tests repo (default is main)"
        required: false
        type: string
        default: "main"

permissions: {}
env:
  dlstreamer-version: "2026.2.0"
  MODELS_PATH: "$HOME/models"
  VIDEO_INPUTS_PATH: "$HOME/videos"
  DLS_REL_PATH: "./dlstreamer"

jobs:
  setup:
    name: "Setup build configuration"
    runs-on: dlstreamer
    outputs:
      should_run: ${{ steps.skip-check.outputs.should_run }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out dlstreamer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if should skip CI
        id: skip-check
        uses: ./.github/actions/common/check-skip-ci
        with:
          job_name: "Build and test .deb pkgs & deb imgs"
          working_directory: "."

      - name: Set matrix configuration
        id: set-matrix
        env:
          SHOULD_RUN: ${{ steps.skip-check.outputs.should_run }}
        shell: bash
        run: |
          if [[ "${SHOULD_RUN}" == "false" ]]; then
            MATRIX=$(jq -n '{
              "include": [
                {
                  "path_dockerfile": "dummy",
                  "ubuntu_version": "skip",
                  "runner_labels": ["dlstreamer"],
                  "runner_print_label": "SKIP"
                }
              ]
            }' | jq -c .)
          else
            MATRIX=$(jq -n '{
              "include": [
                {
                  "path_dockerfile": "./dlstreamer/docker/ubuntu/ubuntu22.Dockerfile",
                  "ubuntu_version": "ubuntu22",
                  "runner_labels": ["tgl-ubuntu22"],
                  "runner_print_label": "TGL"
                },
                {
                  "path_dockerfile": "./dlstreamer/docker/ubuntu/ubuntu24.Dockerfile",
                  "ubuntu_version": "ubuntu24",
                  "runner_labels": ["arl-ubuntu24"],
                  "runner_print_label": "ARL"
                }
              ]
            }' | jq -c .)
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: "[${{ matrix.runner_print_label }}] Build and test ${{ matrix.ubuntu_version }} .debs & deb imgs"
    runs-on: ${{ matrix.runner_labels }}
    needs: setup
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    outputs:
      current-image-size-ubuntu22: ${{ steps.check-size.outputs.current-image-size-ubuntu22 || steps.skip-size.outputs.current-image-size-ubuntu22 }}
      current-image-size-ubuntu24: ${{ steps.check-size.outputs.current-image-size-ubuntu24 || steps.skip-size.outputs.current-image-size-ubuntu24 }}
    steps:
      - name: Skip or execute based on configuration
        id: skip-size
        if: matrix.runner_print_label == 'SKIP'
        run: |
          echo "## ✅ Functional Linux Build and Test Skipped" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** Changes only in excluded files" >> $GITHUB_STEP_SUMMARY
          echo 'current-image-size-ubuntu22=' >> "$GITHUB_OUTPUT"
          echo 'current-image-size-ubuntu24=' >> "$GITHUB_OUTPUT"
          exit 0

      - name: Initial environment clean
        if: needs.setup.outputs.should_run == 'true'
        run: |
          sudo rm -rf dlstreamer

      - name: Check out dlstreamer repository
        if: needs.setup.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          path: dlstreamer

      - name: Init submodules
        if: needs.setup.outputs.should_run == 'true'
        run: |
          cd dlstreamer
          git submodule update --init thirdparty/spdlog

      - name: Check out test repository
        if: needs.setup.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          repository: open-edge-platform/dl-streamer-tests
          persist-credentials: false
          ref: ${{ inputs.test-repo-branch }}
          path: dl-streamer-tests-repo

      - name: Copy DL Streamer tests repo
        if: needs.setup.outputs.should_run == 'true'
        run: |
          cp -r dl-streamer-tests-repo/functional_tests $PWD/$DLS_REL_PATH/tests

      # ======================================================== BUILDING PART ========================================================
      - name: Set up Docker Buildx
        if: needs.setup.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e #4.3.0

      - name: Log in to GitHub Container Registry
        if: needs.setup.outputs.should_run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚢 Build deb final img with cache from GHCR
        if: needs.setup.outputs.should_run == 'true'
        env:
          deb_final_img: ghcr.io/${{ github.repository }}/deb-final-img-${{ matrix.ubuntu_version }}:${{ github.sha }}
          deb_final_img_cached: ghcr.io/${{ github.repository }}/deb-final-img-${{ matrix.ubuntu_version }}:buildcache
          ubuntu_version: ${{ matrix.ubuntu_version }}
          path_dockerfile: ${{ matrix.path_dockerfile }}
        run: |
          docker buildx build \
            --load \
            --target dlstreamer \
            --tag "${deb_final_img}" \
            --cache-from="${deb_final_img_cached}" \
            --build-arg DLSTREAMER_VERSION=${{ env.dlstreamer-version }} \
            --build-arg DLSTREAMER_BUILD_NUMBER=deb-pkg-${ubuntu_version} \
            -f ${path_dockerfile} \
            ${{ env.DLS_REL_PATH }}

      - name: Build dlstreamer img with python
        if: needs.setup.outputs.should_run == 'true'
        env:
          deb_final_img: ghcr.io/${{ github.repository }}/deb-final-img-${{ matrix.ubuntu_version }}:${{ github.sha }}
          deb_final_testing_img: ghcr.io/${{ github.repository }}/deb-final-testing-img-${{ matrix.ubuntu_version }}:${{ github.sha }}
        id: dlstreamer-with-python
        run: |
          docker build \
          -f $DLS_REL_PATH/docker/ubuntu/ubuntu-testing.Dockerfile \
          -t $deb_final_testing_img \
          --build-arg BASE_IMAGE=$deb_final_img \
          ${{ env.DLS_REL_PATH }}

      - name: 📦 Extract .deb packages using script
        if: needs.setup.outputs.should_run == 'true'
        env:
          deb_final_img: ghcr.io/${{ github.repository }}/deb-final-img-${{ matrix.ubuntu_version }}:${{ github.sha }}
        run: |
          chmod +x ${{ env.DLS_REL_PATH }}/scripts/extract_and_verify_debs.sh
          ${{ env.DLS_REL_PATH }}/scripts/extract_and_verify_debs.sh ${deb_final_img}
          ls
          cp -r deb_packages ${{ env.DLS_REL_PATH }}

      # ======================================================== DOCKER TESTING PART ========================================================
      - name: Check models
        if: needs.setup.outputs.should_run == 'true'
        env:
          runner_print_label: ${{ matrix.runner_print_label }}
        run: |
          echo "## 📂 ${runner_print_label} Environment checks" >> $GITHUB_STEP_SUMMARY
          echo "Test repo branch: $test_repo_branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "${{ env.MODELS_PATH }}" ] && [ "$(ls -A "${{ env.MODELS_PATH }}")" ]; then
            echo "Models: found ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "Models: folder not found or it is empty ❌" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Check videos
        if: needs.setup.outputs.should_run == 'true'
        run: |
          if [ -d "${{ env.VIDEO_INPUTS_PATH }}" ] && [ "$(ls -A "${{ env.VIDEO_INPUTS_PATH }}")" ]; then
            echo "Tests input videos: found ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests input videos: folder not found or it is empty ❌" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Init docker tests configurations
        if: needs.setup.outputs.should_run == 'true'
        env:
          runner_print_label: ${{ matrix.runner_print_label }}
        run: |
          echo "## 🚢 ${runner_print_label} Docker tests summary" >> $GITHUB_STEP_SUMMARY
          echo "DOCKER_TEST_CONFIGS=aliveness_config.json" >> $GITHUB_ENV
          echo "Selected test configuration file: $DOCKER_TEST_CONFIGS" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Run Docker tests
        if: needs.setup.outputs.should_run == 'true'
        id: run_docker_tests
        env:
          deb_final_testing_img: ghcr.io/${{ github.repository }}/deb-final-testing-img-${{ matrix.ubuntu_version }}:${{ github.sha }}
          DOCKER_TEST_CONFIGS: ${{ env.DOCKER_TEST_CONFIGS }}
          runner_print_label: ${{ matrix.runner_print_label }}
          ubuntu_version: ${{ matrix.ubuntu_version }}
        run: |
          cd $PWD/$DLS_REL_PATH/tests
          mkdir functional_tests_results
          cd functional_tests_results
          DLS_TESTS_RESULTS_PATH=$PWD
          echo "DLS_TESTS_RESULTS_PATH=$DLS_TESTS_RESULTS_PATH" >> $GITHUB_ENV
          cd ../functional_tests
          ./run_tests.sh \
            --models-path=${{ env.MODELS_PATH }} \
            --video-examples-path=${{ env.VIDEO_INPUTS_PATH }} \
            --meta-configs="$DOCKER_TEST_CONFIGS" \
            --platform-type="${runner_print_label}" \
            --results-path="$DLS_TESTS_RESULTS_PATH" \
            --report-name="DLS_functional_tests_${runner_print_label}_docker_${ubuntu_version}_results" \
            --image-name="${deb_final_testing_img}"

      - name: Upload Docker test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #7.0.1
        if: needs.setup.outputs.should_run == 'true' && steps.run_docker_tests.outcome == 'success'
        with:
          name: DLS_functional_tests_${{ matrix.runner_print_label }}_docker_${{ matrix.ubuntu_version }}_results
          path: "${{ env.DLS_TESTS_RESULTS_PATH }}"

      - name: Check and display Docker test results
        if: needs.setup.outputs.should_run == 'true' && steps.run_docker_tests.outcome == 'success'
        env:
          dls_tests_results_path: ${{ env.DLS_TESTS_RESULTS_PATH }}
          test_repo_branch: ${{ inputs.test-repo-branch }}
          runner_print_label: ${{ matrix.runner_print_label }}
          ubuntu_version: ${{ matrix.ubuntu_version }}
        run: |
          RESULTS_FILE="${dls_tests_results_path}/DLS_functional_tests_${runner_print_label}_docker_${ubuntu_version}_results.txt"

          # Add results to summary with emoji replacements
          sed 's/\[pass\]/:white_check_mark:/g; s/\[\! FAIL \!\]/:x:/g' "$RESULTS_FILE" >> $GITHUB_STEP_SUMMARY

          # Check for failures and fail if any
          FAILED_COUNT=$(grep "^Failed:" "$RESULTS_FILE" | awk '{print $2}')
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::error::$FAILED_COUNT test(s) failed"
            exit 1
          fi

      - name: Clean up tests results
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          DLS_TESTS_RESULTS_PATH: ${{ env.DLS_TESTS_RESULTS_PATH }}
        run: |
          rm -rf "$DLS_TESTS_RESULTS_PATH"

      # ======================================================== ON HOST TESTING PART ========================================================
      - name: Link DL Streamer to home directory
        if: always() && needs.setup.outputs.should_run == 'true'
        run: |
          TARGET="$HOME/$(basename $DLS_REL_PATH)"
          if [ -e "$TARGET" ] || [ -L "$TARGET" ]; then
            rm -rf "$TARGET"
          fi
          ln -s "$PWD/$DLS_REL_PATH" "$TARGET"

      - name: Install DL Streamer on-host
        if: always() && needs.setup.outputs.should_run == 'true'
        run: |
          $DLS_REL_PATH/tests/scripts/installation-on-host-entrypoint.sh $DLS_REL_PATH/deb_packages

      - name: 👋 Test hello_dlstreamer script on host
        if: always() && needs.setup.outputs.should_run == 'true'
        id: test_hello_dlstreamer_script
        env:
          runner_print_label: ${{ matrix.runner_print_label }}
        run: |
          mkdir -p $DLS_REL_PATH/test_hello_dlstreamer
          cd $DLS_REL_PATH/test_hello_dlstreamer
          export MODELS_PATH=${{ env.MODELS_PATH }}
          echo "Running hello_dlstreamer.sh on CPU with model yolo11s"
          /opt/intel/dlstreamer/scripts/hello_dlstreamer.sh --output=file --device=CPU --model=yolo11s --precision=INT8
          OUTPUT_FILE_FOUND=0
          echo "## 💻 ${runner_print_label} On host tests summary" >> $GITHUB_STEP_SUMMARY
          for file in *.mp4; do
              # Check if the file exists and is at least 1kB in size
              if [[ -f "$file" && $(stat --printf="%s" "$file") -ge 1024 ]]; then
                  echo "✅ Valid .mp4 file found: $file"
                  echo "Testing hello_dlstreamer.sh script: PASS ✅" >> $GITHUB_STEP_SUMMARY
                  OUTPUT_FILE_FOUND=1
              fi
          done
          if [[ $OUTPUT_FILE_FOUND -eq 0 ]]; then
              echo "❌ No .mp4 file(s) found or it has less than 1kB size. Exiting..."
              echo "Testing hello_dlstreamer.sh script: FAIL ❌" >> $GITHUB_STEP_SUMMARY
              exit 1
          fi

      - name: Upload hello_dlstreamer output video
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #7.0.1
        if: always() && needs.setup.outputs.should_run == 'true'
        with:
          name: DLS_hello_dlstreamer_output_video_${{ matrix.runner_print_label }}_${{ matrix.ubuntu_version }}_CPU_yolo11s
          path: ${{ env.DLS_REL_PATH }}/test_hello_dlstreamer

      - name: Init on host tests configurations
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          runner_print_label: ${{ matrix.runner_print_label }}
        run: |
          if [[ "${runner_print_label}" == "ARL" ]]; then
            echo "HOST_TEST_CONFIGS=samples_config.json watermark_config.json" >> $GITHUB_ENV
          else
            echo "HOST_TEST_CONFIGS=samples_config.json" >> $GITHUB_ENV
          fi
          echo "Selected test configuration file: $HOST_TEST_CONFIGS" >> $GITHUB_STEP_SUMMARY

      - name: Init host test environment
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          ubuntu_version: ${{ matrix.ubuntu_version }}
        run: |
          sudo apt install -y libcairo2-dev libgirepository1.0-dev # Build-time headers required to compile PyGObject
          if [[ ${ubuntu_version} == "ubuntu24" ]]; then
              sudo apt install -y libopencv-dev
          fi

          if [ -d "$HOME/.virtualenvs" ]; then
            echo "Directory $HOME/.virtualenvs exists - removing it"
            rm -rf $HOME/.virtualenvs
          fi
          mkdir -p $HOME/.virtualenvs/dlstreamer
          python3 -m venv $HOME/.virtualenvs/dlstreamer
          $HOME/.virtualenvs/dlstreamer/bin/pip install --no-cache-dir --upgrade pip -r $DLS_REL_PATH/requirements.txt

          for sample in face_detection_and_classification prompted_detection smart_nvr; do
            req="$DLS_REL_PATH/samples/gstreamer/python/$sample/requirements.txt"
            [ -f "$req" ] && $HOME/.virtualenvs/dlstreamer/bin/pip install --no-cache-dir -r "$req"
          done


      - name: 🚀 Run on host tests
        if: always() && needs.setup.outputs.should_run == 'true'
        id: run_onhost_tests
        env:
          HOST_TEST_CONFIGS: ${{ env.HOST_TEST_CONFIGS }}
          runner_print_label: ${{ matrix.runner_print_label }}
          ubuntu_version: ${{ matrix.ubuntu_version }}
        run: |
          cd $PWD/$DLS_REL_PATH/tests
          mkdir functional_tests_results
          cd functional_tests_results
          DLS_TESTS_RESULTS_PATH=$PWD
          echo "DLS_TESTS_RESULTS_PATH=$DLS_TESTS_RESULTS_PATH" >> $GITHUB_ENV
          cd ../functional_tests
          source $HOME/.virtualenvs/dlstreamer/bin/activate
          ./run_tests.sh \
            --models-path=${{ env.MODELS_PATH }} \
            --video-examples-path=${{ env.VIDEO_INPUTS_PATH }} \
            --meta-configs="$HOST_TEST_CONFIGS" \
            --platform-type="${runner_print_label}" \
            --results-path="$DLS_TESTS_RESULTS_PATH" \
            --report-name="DLS_functional_tests_${runner_print_label}_on_host_${ubuntu_version}_results" \
            --on-host
          deactivate

      - name: Upload host test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #7.0.1
        if: always() && needs.setup.outputs.should_run == 'true'
        with:
          name: DLS_functional_tests_${{ matrix.runner_print_label }}_on_host_${{ matrix.ubuntu_version }}_results
          path: "${{ env.DLS_TESTS_RESULTS_PATH }}"

      - name: Check and display host test results
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          dls_tests_results_path: ${{ env.DLS_TESTS_RESULTS_PATH }}
          test_repo_branch: ${{ inputs.test-repo-branch }}
          runner_print_label: ${{ matrix.runner_print_label }}
          ubuntu_version: ${{ matrix.ubuntu_version }}
        run: |
          RESULTS_FILE="${dls_tests_results_path}/DLS_functional_tests_${runner_print_label}_on_host_${ubuntu_version}_results.txt"

          # Add results to summary with emoji replacements
          sed 's/\[pass\]/:white_check_mark:/g; s/\[\! FAIL \!\]/:x:/g' "$RESULTS_FILE" >> $GITHUB_STEP_SUMMARY

          # Check for failures and fail if any
          FAILED_COUNT=$(grep "^Failed:" "$RESULTS_FILE" | awk '{print $2}')
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::error::$FAILED_COUNT test(s) failed"
            exit 1
          fi

      - name: 🔍 Generate visual diff reports for failed host tests
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          dls_tests_results_path: ${{ env.DLS_TESTS_RESULTS_PATH }}
          runner_print_label: ${{ matrix.runner_print_label }}
          ubuntu_version: ${{ matrix.ubuntu_version }}
          dls_branch: ${{ github.ref_name }}
          dls_commit: ${{ github.sha }}
          test_repo_branch: ${{ inputs.test-repo-branch }}
        run: |
          RESULTS_FILE="${dls_tests_results_path}/DLS_functional_tests_${runner_print_label}_on_host_${ubuntu_version}_results.txt"
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "No results file at $RESULTS_FILE, skipping diff report generation."
            exit 0
          fi

          video_examples_path="${{ env.VIDEO_INPUTS_PATH }}"

          # save_summary_to_text_file() writes one line per failed test case as
          # '[! FAIL !] <test_name> (<duration>)' - extract just the test names.
          FAILED_TESTS=$(grep -oP '^\[! FAIL !\] \K\S+' "$RESULTS_FILE" | sort -u || true)
          if [ -z "$FAILED_TESTS" ]; then
            echo "No failed tests, skipping diff report generation."
            exit 0
          fi
          echo "Failed tests: $FAILED_TESTS"

          source $HOME/.virtualenvs/dlstreamer/bin/activate
          pip install --no-cache-dir opencv-python-headless numpy

          TESTS_DIR="$PWD/$DLS_REL_PATH/tests/functional_tests"
          GENERATED_CONFIGS_DIR="$TESTS_DIR/pipeline_test/configs_ov2/generated_configs"
          PRED_DIR="$dls_tests_results_path/metadata"
          # Platform label baked into the path so the merge job can find it without relying on artifact naming.
          REPORTS_DIR="$dls_tests_results_path/diff_reports/${runner_print_label}_on_host_${ubuntu_version}"
          DIFF_SCRIPT="$TESTS_DIR/gt_compare/diff_report/generate_diff_report.py"

          echo "Generated configs dir: $GENERATED_CONFIGS_DIR"
          if [ -d "$GENERATED_CONFIGS_DIR" ]; then
            FOUND_CONFIGS=$(find "$GENERATED_CONFIGS_DIR" -maxdepth 1 -name '*_final.json' 2>/dev/null)
            if [ -z "$FOUND_CONFIGS" ]; then
              echo "::warning::No '*_final.json' files found in $GENERATED_CONFIGS_DIR - no diff reports can be generated for any failed test."
            else
              echo "Found generated config(s):"
              echo "$FOUND_CONFIGS"
            fi
          else
            echo "::warning::Generated configs directory does not exist: $GENERATED_CONFIGS_DIR - no diff reports can be generated for any failed test."
          fi

          REPORTS_OK=0
          REPORTS_TOTAL=0
          for test_name in $FAILED_TESTS; do
            REPORTS_TOTAL=$((REPORTS_TOTAL + 1))
            echo "::group::Diff report for $test_name"

            MATCHING_CONFIGS=()
            for config in "$GENERATED_CONFIGS_DIR"/*_final.json; do
              [ -f "$config" ] || continue
              # jq, not grep: run_tests.sh may reformat the file, splitting name/value across lines.
              if jq -e --arg name "$test_name" '
                   any(.test_sets[]?;
                     if type == "object" then .name == $name
                     elif type == "array" then any(.[]?; type == "array" and .[0] == "name" and .[1] == $name)
                     else false end)
                 ' "$config" > /dev/null 2>&1; then
                MATCHING_CONFIGS+=("$config")
              fi
            done

            if [ "${#MATCHING_CONFIGS[@]}" -eq 0 ]; then
              echo "::warning::Could not generate diff report for '$test_name' (test name not found in any generated config)"
              echo "::endgroup::"
              continue
            fi
            if [ "${#MATCHING_CONFIGS[@]}" -gt 1 ]; then
              echo "::warning::Test name '$test_name' is defined in ${#MATCHING_CONFIGS[@]} generated configs (${MATCHING_CONFIGS[*]}) - name is not unique across configs. Using the first match; the resolved GT/pred/video paths may be for the wrong config."
            fi

            REPORT_GENERATED=0
            for config in "${MATCHING_CONFIGS[@]}"; do
              GT_BASE=$(jq -r '.test_set_properties["host.dataset.groundtruth.base"] // .test_set_properties["dataset.groundtruth.base"] // empty' "$config")
              echo "Config: $config"
              echo "Resolved GT base: '$GT_BASE'"
              if [ -z "$GT_BASE" ]; then
                echo "No usable GT base in this config, skipping."
                continue
              fi
              GT_DIR="$TESTS_DIR/pipeline_test/$GT_BASE"

              if python3 "$DIFF_SCRIPT" \
                  --config "$config" \
                  --test-name "$test_name" \
                  --gt-dir "$GT_DIR" \
                  --pred-dir "$PRED_DIR" \
                  --video-dir "$video_examples_path" \
                  --env-context host \
                  --dls-branch "$dls_branch" \
                  --dls-commit "$dls_commit" \
                  --test-repo-branch "$test_repo_branch" \
                  --output-dir "$REPORTS_DIR/$test_name"; then
                REPORT_GENERATED=1
                break
              else
                DIFF_EXIT_CODE=$?
                if [ "$DIFF_EXIT_CODE" -eq 3 ]; then
                  echo "No prediction/GT file on disk for this config (see message above) - this test likely crashed/errored without producing output, not a diff-report bug."
                else
                  echo "generate_diff_report.py exited with status $DIFF_EXIT_CODE for this config (see output above for the reason)."
                fi
              fi
            done
            if [ "$REPORT_GENERATED" -eq 0 ]; then
              echo "::warning::Could not generate diff report for '$test_name' (matched config(s) had no usable GT base, or missing GT/prediction/video file - see log group above for details)"
            else
              REPORTS_OK=$((REPORTS_OK + 1))
            fi
            echo "::endgroup::"
          done

          echo "Diff report summary: $REPORTS_OK/$REPORTS_TOTAL generated successfully."
          if [ "$REPORTS_OK" -eq 0 ] && [ "$REPORTS_TOTAL" -gt 0 ]; then
            echo "::warning::0 of $REPORTS_TOTAL diff reports were generated. Expand the 'Diff report for <test>' groups above for details."
          fi
          deactivate

      - name: Upload diff reports for failed host tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #7.0.1
        if: always() && needs.setup.outputs.should_run == 'true'
        with:
          name: DLS_functional_tests_${{ matrix.runner_print_label }}_on_host_${{ matrix.ubuntu_version }}_diff_reports
          path: "${{ env.DLS_TESTS_RESULTS_PATH }}/diff_reports"
          if-no-files-found: ignore

      - name: Uninstall dlstreamer
        if: always() && needs.setup.outputs.should_run == 'true'
        run: |
          $DLS_REL_PATH/tests/scripts/uninstall-dlstreamer.sh

      - name: Check Docker image size
        if: always() && needs.setup.outputs.should_run == 'true'
        id: check-size
        env:
          deb_final_img: ghcr.io/${{ github.repository }}/deb-final-img-${{ matrix.ubuntu_version }}:${{ github.sha }}
          MATRIX_UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
        run: |
          IMAGE_NAME=${deb_final_img}
          # Use 'docker images' SIZE — identical to the SIZE column visible when running 'docker images' manually on the runner
          SIZE_STR=$(docker images --no-trunc --format '{{.Size}}' "$IMAGE_NAME")
          IMAGE_SIZE_MB=$(echo "$SIZE_STR" | awk '
            /GB$/ { printf "%d", $1 * 1024; next }
            /MB$/ { printf "%d", $1; next }
            /kB$/ { printf "0"; next }
          ')

          if [[ -z "${IMAGE_SIZE_MB}" ]]; then
            echo "❌ Failed to detect Docker image size for ${IMAGE_NAME}"
            exit 1
          fi

          echo "Actual image size (docker images SIZE): ${SIZE_STR} (~${IMAGE_SIZE_MB} MB)"
          echo "image_size_mb=${IMAGE_SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "size_str=${SIZE_STR}" >> "$GITHUB_OUTPUT"
          echo "current-image-size-${MATRIX_UBUNTU_VERSION}=${IMAGE_SIZE_MB}" >> "$GITHUB_OUTPUT"

      - name: Print image size summary
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          IMAGE_SIZE_MB: ${{ steps.check-size.outputs.image_size_mb }}
          IMAGE_SIZE_STR: ${{ steps.check-size.outputs.size_str }}
          UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
        run: |
          {
            echo "## 🐳 Docker image size"
            echo ""
            echo "| Image | Size |"
            echo "|-------|------|"
            echo "| Current Docker ${UBUNTU_VERSION}-deb | **${IMAGE_SIZE_STR} (~${IMAGE_SIZE_MB} MB)** |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================== CLEANUP PART ========================================================
      - name: Clean up
        if: always() && needs.setup.outputs.should_run == 'true'
        env:
          deb_final_img: ghcr.io/${{ github.repository }}/deb-final-img-${{ matrix.ubuntu_version }}:${{ github.sha }}
        run: |
          rm -rf $HOME/.virtualenvs
          docker rmi ${deb_final_img} || true
          sudo rm -f $HOME/dlstreamer
          rm -rf dlstreamer
          rm -rf $HOME/dl-streamer-tests-repo
          docker system prune -a -f

  merge-diff-reports:
    name: "Merge diff reports from all platforms"
    needs: [setup, build]
    if: always() && needs.setup.outputs.should_run == 'true'
    runs-on: dlstreamer
    permissions:
      actions: write
    steps:
      - name: Clean stale merged-diff-reports dir from a previous run on this self-hosted runner
        run: rm -rf merged-diff-reports

      # Each matrix leg uploads its own diff_reports artifact; combine them here.
      - name: Download all per-platform diff report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "DLS_functional_tests_*_diff_reports"
          path: merged-diff-reports
          merge-multiple: false

      - name: Regroup reports by test name so platforms sit side by side
        run: |
          # Exclude wrapper dirs (they end in _diff_reports and also match *_on_host_*).
          regrouped="$(mktemp -d)"
          while IFS= read -r -d '' platform_dir; do
            platform="$(basename "$platform_dir")"
            for test_dir in "$platform_dir"/*/; do
              [ -d "$test_dir" ] || continue
              test_name="$(basename "$test_dir")"
              mkdir -p "$regrouped/$test_name/$platform"
              cp -r "${test_dir%/}/." "$regrouped/$test_name/$platform/"
            done
          done < <(find merged-diff-reports -type d -name '*_on_host_*' ! -name '*_diff_reports' -print0)
          rm -rf merged-diff-reports
          mv "$regrouped" merged-diff-reports

      - name: Collect GT update proposals into one copy-paste-ready folder
        run: |
          mkdir -p merged-diff-reports/gt_update_proposals
          # category (e.g. samples_ARL) is platform-unique, so flattening never collides.
          find merged-diff-reports -type d -name gt_update_proposal -print0 |
            while IFS= read -r -d '' dir; do
              cp -r "$dir"/. merged-diff-reports/gt_update_proposals/
            done

      - name: Remove per-test GT update proposals now that they're collected above
        run: |
          find merged-diff-reports -type d -name gt_update_proposal -exec rm -rf {} +

      - name: Generate aggregator index.html
        run: |
          INDEX="merged-diff-reports/index.html"
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Diff reports - all platforms</title>'
            echo '<style>body{font-family:sans-serif;margin:2rem}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.4rem .8rem;text-align:left}a{margin-right:.6rem}</style>'
            echo '</head><body><h1>Diff reports - all platforms</h1>'
            GT_COUNT=$(find merged-diff-reports/gt_update_proposals -type f 2>/dev/null | wc -l)
            if [ "$GT_COUNT" -gt 0 ]; then
              echo "<p><a href=\"gt_update_proposals/\">GT update proposals ($GT_COUNT files)</a></p>"
            fi
            echo '<table><tr><th>Test</th><th>Platforms</th></tr>'
            find merged-diff-reports -mindepth 1 -maxdepth 1 -type d ! -name gt_update_proposals | sort | while read -r test_dir; do
              test_name="$(basename "$test_dir")"
              echo "<tr><td>$test_name</td><td>"
              find "$test_dir" -mindepth 1 -maxdepth 1 -type d | sort | while read -r platform_dir; do
                platform="$(basename "$platform_dir")"
                echo "<a href=\"$test_name/$platform/index.html\">$platform</a>"
              done
              echo '</td></tr>'
            done
            echo '</table></body></html>'
          } > "$INDEX"

      - name: Upload combined diff reports and GT update proposals artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #7.0.1
        if: always()
        with:
          name: DIFF_REPORTS_DLS_functional_tests
          path: merged-diff-reports
          if-no-files-found: ignore

      # Per-platform artifacts are only needed to transport files into this job.
      - name: Delete intermediate per-platform diff report artifacts
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // listWorkflowRunArtifacts defaults to one page (30 items) - paginate to see all of them.
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts) {
              if (/^DLS_functional_tests_.+_on_host_.+_diff_reports$/.test(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`Deleted intermediate artifact: ${artifact.name}`);
              }
            }
